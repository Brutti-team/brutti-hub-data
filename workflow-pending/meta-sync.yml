name: Meta sync

# Read-only Meta Graph sync (Facebook + Instagram posts and insights).
# Rebuilds meta/*.json and commits only when the data changed.
# Never publishes anything to Facebook or Instagram.

on:
  schedule:
    - cron: '17 */6 * * *'   # every 6 hours (UTC)
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'How many days back to refresh (default 90)'
        required: false
        default: '90'
      dry_run:
        description: 'Dry run (fetch but do not commit)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: meta-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync Meta insights
        id: sync
        env:
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
          META_INSTAGRAM_USER_ID: ${{ secrets.META_INSTAGRAM_USER_ID }}
          META_GRAPH_VERSION: ${{ secrets.META_GRAPH_VERSION }}
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days || '90' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '0' }}
        run: |
          set +e
          node scripts/sync-meta.mjs
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit changes (only if data changed)
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "brutti-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Meta sync $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Keep schedule alive
        # GitHub pauses scheduled workflows after 60 days without repo activity.
        if: github.event.inputs.dry_run != 'true'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "brutti-hub-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep Meta sync schedule active"
            git push
          else
            echo "Recent commit found; no keep-alive needed."
          fi

      - name: Report token problem
        if: steps.sync.outputs.exit_code != '0'
        run: |
          if [ "${{ steps.sync.outputs.exit_code }}" = "2" ]; then
            echo "::error::Meta token expired or invalid. Replace the META_PAGE_ACCESS_TOKEN secret."
          else
            echo "::error::Meta sync failed. Check the log above (tokens are never printed)."
          fi
          exit 1
